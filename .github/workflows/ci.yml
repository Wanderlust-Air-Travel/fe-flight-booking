name: Frontend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint || echo "Lint not configured"

      - name: Type check
        run: npx tsc --noEmit

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --coverage --passWithNoTests || echo "No tests found"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL_STAGING || 'http://localhost:3000' }}
          NEXT_PUBLIC_WS_URL: ${{ vars.WS_URL_STAGING || 'http://localhost:3000' }}
          NEXT_PUBLIC_APP_URL: ${{ vars.APP_URL_STAGING || 'http://localhost:3001' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: .next/
          retention-days: 7

      - name: Docker Build
        run: docker build -t fe-flight-booking:${{ github.sha }} .

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via Docker
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /app/fe-flight-booking
            git pull origin main
            docker build -t fe-flight-booking:latest .
            docker stop fe-flight-booking || true
            docker run -d --name fe-flight-booking \
              -p 3001:3000 \
              -e NEXT_PUBLIC_API_URL=${{ vars.API_URL_STAGING }} \
              -e NEXT_PUBLIC_WS_URL=${{ vars.WS_URL_STAGING }} \
              --restart unless-stopped \
              fe-flight-booking:latest

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/fe-flight-booking:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/fe-flight-booking:latest

      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/fe-flight-booking:latest
            docker stop fe-flight-booking || true
            docker run -d --name fe-flight-booking \
              -p 3001:3000 \
              -e NEXT_PUBLIC_API_URL=${{ vars.API_URL_PRODUCTION }} \
              -e NEXT_PUBLIC_WS_URL=${{ vars.WS_URL_PRODUCTION }} \
              -e NEXT_PUBLIC_APP_URL=${{ vars.APP_URL_PRODUCTION }} \
              --restart unless-stopped \
              ${{ secrets.DOCKER_USERNAME }}/fe-flight-booking:latest
